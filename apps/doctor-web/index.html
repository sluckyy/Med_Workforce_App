<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Workforce Passport</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Written at container start by docker/40-runtime-config.sh from the
      API_BASE_URL env var (see config.ts). Must load before main.tsx so

      In `npm run dev`, no such file exists (404 is harmless) and config.ts
      falls back to VITE_API_BASE_URL / localhost instead.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
