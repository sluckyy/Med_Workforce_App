services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: med_workforce
      POSTGRES_PASSWORD: med_workforce_dev
      POSTGRES_DB: med_workforce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U med_workforce"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://med_workforce:med_workforce_dev@postgres:5432/med_workforce
      PORT: 8000
      JWT_SECRET_KEY: change-me-32-chars-minimum-for-dev-only
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
