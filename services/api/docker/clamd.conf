# Minimal clamd config for in-container AV scanning (modules/passport/scan.ts
# talks to this over the local unix socket). Not meant to be a hardened
# general-purpose mail/file-server AV config — just the knobs this
# single-tenant, same-container setup actually needs.
# No LogFile: Foreground already prints to stdout, and explicitly
# pointing a log file at /dev/stdout makes clamd try to open() that path
# directly, which loops on at least one container runtime this image was
# tested against (same failure mode as freshclam's UpdateLogFile, see
# freshclam.conf's comment).
LogTime yes
LogVerbose no
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup root
LocalSocketMode 666
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
# Evidence uploads are already capped at 15MB by evidence-routes.ts; this
# is a generous ceiling on top of that, not the enforcement point.
StreamMaxLength 20M
MaxFileSize 20M
MaxScanSize 100M
MaxThreads 4
MaxConnectionQueueLength 15
Foreground yes
PidFile /run/clamav/clamd.pid
