# Used twice: once at image build time (one-shot, bakes a database into the
# image so clamd never has to wait on a cold download to start), and once at
# container start (--daemon, see start.sh) to refresh it in the background
# without blocking the app's own startup. Not wired to notify clamd
# directly (that needs EnableReloadCommand, off by default) — clamd's own
# SelfCheck (hourly by default) notices the refreshed files and reloads
# signatures on its own, so nothing here needs to signal it.
DatabaseMirror database.clamav.net
DatabaseDirectory /var/lib/clamav
# No UpdateLogFile: Foreground already prints progress to stdout, and
# explicitly pointing a log file at /dev/stdout makes freshclam try to
# open() that path — which hits a Docker BuildKit RUN-step quirk where
# /dev/stdout resolves as a self-referential symlink, failing the
# build-time database bake below.
Foreground yes
Checks 12
